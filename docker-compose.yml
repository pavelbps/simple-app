services:
  app:
    build: 
      context: .
      args:
        PORT: ${APP_PORT:-5000}
    ports:
      - "${HOST_PORT:-5000}:${APP_PORT:-5000}"
    expose:
      - "${APP_PORT:-5000}"
    environment:
      - FLASK_ENV=production
      - APP_PORT=${APP_PORT:-5000}
      - HOST_PORT=${HOST_PORT:-5000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-5000}/health"]
      interval: 10s
      retries: 3
